<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>محاكي بوت متابعة القضايا</title>
<style>
  :root {
    --bg: #0b141a;
    --panel: #111b21;
    --header: #202c33;
    --in: #202c33;
    --out: #005c4b;
    --text: #e9edef;
    --muted: #8696a0;
    --accent: #00a884;
    --border: #2a3942;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
  }
  aside {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  aside h1 { font-size: 17px; margin: 0 0 4px; }
  aside p.sub { color: var(--muted); font-size: 12px; margin: 0 0 20px; line-height: 1.6; }
  aside h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 22px 0 10px; }
  .num {
    display: block; width: 100%; text-align: right; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
    font-family: inherit; transition: background .15s, border-color .15s;
  }
  .num:hover { background: #1c282f; }
  .num.active { border-color: var(--accent); background: #12241f; }
  .num strong { display: block; font-size: 13px; margin-bottom: 3px; }
  .num span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.9; }
  .hint code {
    background: var(--header); padding: 2px 7px; border-radius: 5px;
    color: var(--text); cursor: pointer; font-size: 11px;
  }
  main { display: flex; flex-direction: column; min-width: 0; }
  header {
    background: var(--header); padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; font-size: 18px;
  }
  header .who { font-size: 14px; font-weight: 600; }
  header .status { font-size: 11px; color: var(--muted); }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px 40px;
    display: flex; flex-direction: column; gap: 8px;
    background-image: radial-gradient(circle at 20% 30%, #12222c 0%, transparent 45%),
                      radial-gradient(circle at 80% 70%, #12222c 0%, transparent 45%);
  }
  .msg {
    max-width: 72%; padding: 8px 12px; border-radius: 10px;
    font-size: 14px; line-height: 1.65; white-space: pre-wrap;
    word-wrap: break-word; animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg.out { background: var(--out); align-self: flex-start; border-top-right-radius: 2px; }
  .msg.in  { background: var(--in);  align-self: flex-end;   border-top-left-radius: 2px; }
  .msg .time { display: block; font-size: 10px; color: rgba(233,237,239,.5); margin-top: 4px; }
  .msg em { color: var(--muted); font-style: italic; font-size: 12.5px; }
  .msg strong { font-weight: 700; }
  .typing { align-self: flex-end; color: var(--muted); font-size: 12px; padding: 6px 12px; }
  form {
    display: flex; gap: 10px; padding: 14px 20px;
    background: var(--header); border-top: 1px solid var(--border);
  }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 20px; padding: 11px 18px; font-size: 14px; font-family: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button.send {
    background: var(--accent); color: #06251d; border: 0; border-radius: 50%;
    width: 42px; height: 42px; font-size: 17px; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    #chat { padding: 16px; }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>
<aside>
  <h1>محاكي بوت القضايا</h1>
  <p class="sub">نسخة تجريبية على بيانات وهمية. اختر رقم عميل لتتحدث بصفته — البوت يتعرف عليه من رقمه فقط.</p>

  <h2>أرقام تجريبية</h2>
  <div id="numbers"></div>

  <h2>جرّب أيضاً</h2>
  <p class="hint">
    <code data-say="1">1</code> حالة القضايا<br />
    <code data-say="2">2</code> موعد الجلسة<br />
    <code data-say="3">3</code> موظف<br />
    <code data-say="1445/ت/2301">1445/ت/2301</code> رقم قضية<br />
    <code data-say="متى جلستي القادمة؟">سؤال حر</code><br />
    <code data-say="9999">9999</code> رقم غير موجود
  </p>

  <h2>حالة البيانات</h2>
  <p class="hint" id="stats">…</p>
</aside>

<main>
  <header>
    <div class="avatar">⚖️</div>
    <div>
      <div class="who" id="peer">مكتب المحاماة</div>
      <div class="status" id="peerPhone">اختر رقماً للبدء</div>
    </div>
  </header>

  <div id="chat"></div>

  <form id="composer">
    <input type="text" id="input" placeholder="اكتب رسالتك…" autocomplete="off" />
    <button class="send" type="submit" id="sendBtn">➤</button>
  </form>
</main>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const form = document.getElementById('composer');
const sendBtn = document.getElementById('sendBtn');
let currentPhone = null;

const now = () => new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

// تنسيق واتساب المبسّط: *غامق* و _مائل_
const format = (text) => text
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
  .replace(/_([^_\n]+)_/g, '<em>$1</em>');

function bubble(text, dir) {
  const el = document.createElement('div');
  el.className = 'msg ' + dir;
  el.innerHTML = format(text) + '<span class="time">' + now() + '</span>';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function typing(on) {
  document.querySelector('.typing')?.remove();
  if (!on) return;
  const el = document.createElement('div');
  el.className = 'typing';
  el.textContent = 'يكتب…';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

async function loadNumbers() {
  const res = await fetch('/api/demo-numbers');
  const data = await res.json();
  const wrap = document.getElementById('numbers');
  wrap.innerHTML = '';

  data.numbers.forEach((entry, index) => {
    const btn = document.createElement('button');
    btn.className = 'num';
    btn.innerHTML = '<strong>' + entry.name + '</strong><span>' + entry.phone + ' · ' + entry.cases + ' قضية</span>';
    btn.onclick = () => selectNumber(entry, btn);
    wrap.appendChild(btn);
    if (index === 0) selectNumber(entry, btn);
  });

  const unknown = document.createElement('button');
  unknown.className = 'num';
  unknown.innerHTML = '<strong>رقم غير مسجّل</strong><span>966599999999 · اختبار الخصوصية</span>';
  unknown.onclick = () => selectNumber({ phone: '966599999999', name: 'رقم غير مسجّل' }, unknown);
  wrap.appendChild(unknown);

  const s = data.stats;
  document.getElementById('stats').innerHTML =
    s.error
      ? '⚠️ ' + s.error
      : s.cases + ' قضية · ' + s.clients + ' عميل<br />آخر قراءة للملف: ' +
        (s.lastLoadedAt ? new Date(s.lastLoadedAt).toLocaleTimeString('ar-SA') : '—');
}

async function selectNumber(entry, btn) {
  currentPhone = entry.phone;
  // نبدأ كل عرض من جلسة نظيفة حتى يظهر الترحيب من جديد
  fetch('/api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: entry.phone }),
  }).catch(() => {});
  document.querySelectorAll('.num').forEach((n) => n.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('peer').textContent = entry.name;
  document.getElementById('peerPhone').textContent = 'تتحدث بصفة ' + entry.phone;
  chat.innerHTML = '';
  bubble('— بدأت محادثة جديدة بصفة ' + entry.name + ' —', 'in');
  input.focus();
}

async function send(text) {
  if (!text.trim() || !currentPhone) return;
  bubble(text, 'out');
  input.value = '';
  sendBtn.disabled = true;
  typing(true);

  try {
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: currentPhone, text }),
    });
    const data = await res.json();
    typing(false);
    for (const reply of data.replies ?? []) {
      bubble(reply, 'in');
      await new Promise((r) => setTimeout(r, 280));
    }
  } catch (err) {
    typing(false);
    bubble('⚠️ تعذّر الاتصال بالخادم', 'in');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
document.querySelectorAll('code[data-say]').forEach((el) => {
  el.addEventListener('click', () => send(el.dataset.say));
});

loadNumbers();
</script>
</body>
</html>
