name: نشر صفحة العرض

# ينشر صفحة العرض على GitHub Pages عبر فرع gh-pages.
#
# لماذا فرع بدل نشر Actions المباشر: تفعيل Pages برمجياً يحتاج صلاحية
# لا يملكها توكن الـ workflow هنا (Resource not accessible by integration)،
# بينما الدفع إلى gh-pages فعّل الموقع تلقائياً.

on:
  push:
    branches: [claude/whatsapp-case-tracking-bot-co2lw5]
    paths:
      - 'demo/standalone.html'
      - 'scripts/build-demo.js'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: بناء الصفحة برابط النشر
        env:
          DEMO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build:demo

      - name: تجهيز محتوى النشر
        run: |
          mkdir -p site
          cp demo/index.html demo/preview.png site/
          touch site/.nojekyll

      - name: النشر على gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: 'تحديث صفحة العرض'
