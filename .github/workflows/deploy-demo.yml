name: نشر صفحة العرض

# ينشر مجلد demo/ على GitHub Pages ليصبح الرابط قابلاً للمشاركة مع العميل
# دون تسجيل دخول. يعمل تلقائياً عند تعديل الصفحة، أو يدوياً من تبويب Actions.

on:
  push:
    branches: [claude/whatsapp-case-tracking-bot-co2lw5]
    paths:
      - 'demo/**'
      - 'scripts/build-demo.js'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشر واحد في كل مرة، دون إلغاء نشر جارٍ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تهيئة Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # نبني الصفحة داخل الـ workflow لأن رابط النشر لا يُعرف إلا هنا،
      # وهو مطلوب لمعاينة الرابط عند إرساله في واتساب.
      - name: بناء الصفحة برابط النشر
        env:
          DEMO_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
